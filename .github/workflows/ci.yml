name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.16.0', '22', '24', '26']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Sozdizimi kontrolu
        run: |
          for f in server.js scripts/check-env.js public/app.js src/*.js; do
            echo "kontrol: $f"
            node --check "$f"
          done

      - name: Sunucu acilis testi
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/api/project > /dev/null; then
              echo "Sunucu ayakta."
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Sunucu 30 saniye icinde yanit vermedi."
          kill $SERVER_PID 2>/dev/null || true
          exit 1
